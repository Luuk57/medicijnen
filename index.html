<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicijnen Monitor</title>
    <style>
        :root {
            --bg-base: #030508;
            --surface-glass: rgba(13, 17, 28, 0.85);
            --surface-card: rgba(18, 24, 38, 0.75);
            --border-glass: rgba(0, 242, 254, 0.2);
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-green: #10b981;
            --neon-orange: #f59e0b;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; padding: 15px; background-image: radial-gradient(circle at 50% 10%, #0c1425 0%, var(--bg-base) 100%); display: flex; flex-direction: column; align-items: center; }

        header { background: var(--surface-glass); border: 1px solid var(--border-glass); border-radius: 14px; padding: 12px 18px; width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; backdrop-filter: blur(10px); }
        .app-title { font-size: 15px; font-weight: 800; color: var(--neon-cyan); letter-spacing: 1px; }
        .header-btns { display: flex; gap: 6px; align-items: center; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-glass); color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }

        .tab-bar { display: flex; width: 100%; max-width: 500px; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 10px; color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: var(--neon-cyan); color: #030508; border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,242,254,0.3); }

        .card { background: var(--surface-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 18px; width: 100%; max-width: 500px; margin-bottom: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .card-title { font-size: 13px; font-weight: 800; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
        .btn-pdf { background: rgba(0,242,254,0.1); border: 1px solid var(--border-glass); color: var(--neon-cyan); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .sector-header { font-size: 12px; font-weight: 800; color: var(--neon-blue); text-transform: uppercase; margin: 14px 0 6px 0; display: flex; align-items: center; gap: 6px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; }
        .med-item { background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .med-item.taken { border-color: var(--neon-green); background: rgba(16,185,129,0.08); }
        .med-info { display: flex; flex-direction: column; }
        .med-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .med-dose { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .med-extra { font-size: 10px; color: var(--neon-orange); margin-top: 2px; font-weight: 600; }
        
        .check-btn { background: #1e293b; border: 1px solid var(--border-glass); color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .med-item.taken .check-btn { background: var(--neon-green); border-color: var(--neon-green); color: white; }

        .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        input, select { background: #0f172a; border: 1px solid var(--border-glass); border-radius: 8px; padding: 10px; color: white; font-size: 14px; font-weight: 600; outline: none; width: 100%; }

        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0f172a; border: 1px solid var(--border-glass); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-main); cursor: pointer; }
        .checkbox-label input { width: 16px; height: 16px; accent-color: var(--neon-cyan); }

        .btn-submit { width: 100%; padding: 12px; background: var(--neon-cyan); color: #030508; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 8px; box-shadow: 0 0 12px rgba(0,242,254,0.25); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #0f172a; border: 1px solid var(--border-glass); padding: 20px; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { color: var(--neon-cyan); margin-bottom: 14px; font-size: 16px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-cancel { background: #1e293b; color: var(--text-muted); }
        .btn-confirm { background: var(--neon-cyan); color: #030508; }

        .sync-status { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .date-picker-box { display: flex; align-items: center; gap: 8px; }
        .delete-btn { background: var(--neon-red); color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="app-title">💊 MEDICIJNEN MONITOR</div>
            <div class="sync-status" id="syncStatus">Cloud: Niet ingesteld</div>
        </div>
        <div class="header-btns">
            <button class="icon-btn" onclick="openModal('settingsModal')" title="Instellingen">☁️</button>
        </div>
    </header>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabDailyBtn" onclick="switchTab('daily')">📋 Vandaag Afvinken</button>
        <button class="tab-btn" id="tabManageBtn" onclick="switchTab('manage')">⚙️ Medicijnen Beheer</button>
    </div>

    <!-- TAB 1: DAGELIJKS OVERZICHT & AFVINKEN -->
    <div class="card" id="tabDaily">
        <div class="top-action-bar">
            <div class="date-picker-box">
                <label style="margin:0;">Datum:</label>
                <input type="date" id="selectedDate" onchange="renderDailyList()">
            </div>
            <button class="btn-pdf" onclick="openModal('pdfModal')">📄 PDF Maken</button>
        </div>

        <div class="sector-header">🌅 Morgen (06:00 - 12:00)</div>
        <div id="sectorMorgen"></div>

        <div class="sector-header">☀️ Middag (12:00 - 18:00)</div>
        <div id="sectorMiddag"></div>

        <div class="sector-header">🌆 Avond (18:00 - 23:00)</div>
        <div id="sectorAvond"></div>

        <div class="sector-header">🌙 Nacht (23:00 - 06:00)</div>
        <div id="sectorNacht"></div>

        <button class="btn-submit" onclick="saveAndSyncToday()" style="margin-top: 15px;">💾 WIJZIGINGEN OPSLAAN & SYNC</button>
    </div>

    <!-- TAB 2: MEDICIJNEN BEHEER -->
    <div class="card" id="tabManage" style="display: none;">
        <div class="card-title">Nieuw Medicijn Toevoegen</div>
        <div class="form-group">
            <label>Naam Medicijn:</label>
            <input type="text" id="newMedName" placeholder="bijv. Paracetamol...">
        </div>
        <div class="form-group">
            <label>Dosering:</label>
            <input type="text" id="newMedDose" placeholder="bijv. 3 x 2, 1 tablet...">
        </div>
        
        <label>Moment(en) / Sectoren:</label>
        <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" value="Morgen" class="new-sector"> Morgen</label>
            <label class="checkbox-label"><input type="checkbox" value="Middag" class="new-sector"> Middag</label>
            <label class="checkbox-label"><input type="checkbox" value="Avond" class="new-sector"> Avond</label>
            <label class="checkbox-label"><input type="checkbox" value="Nacht" class="new-sector"> Nacht</label>
        </div>

        <div class="form-group">
            <label>Specifieke Tijd (optioneel):</label>
            <input type="text" id="newMedTime" placeholder="bijv. 19:00">
        </div>
        <div class="form-group">
            <label>Situatie / Opmerking (optioneel):</label>
            <input type="text" id="newMedNote" placeholder="bijv. Avond eten, Volgens voorschrift...">
        </div>
        <button class="btn-submit" onclick="addMedicine()">TOEVOEGEN AAN LIJST</button>

        <div class="card-title" style="margin-top:20px;">Ingestelde Medicijnen</div>
        <div id="managedMedsList"></div>
    </div>

    <!-- PDF Modal -->
    <div class="modal" id="pdfModal">
        <div class="modal-content">
            <h3>PDF Rapport Genereren</h3>
            <label>Startdatum / Dag:</label>
            <input type="date" id="pdfStartDate">
            <label style="margin-top:10px;">Einddatum (voor periode):</label>
            <input type="date" id="pdfEndDate">
            <div class="modal-buttons" style="flex-direction:column; gap:8px; margin-top:15px;">
                <button class="btn-confirm" onclick="generatePDFReport()">📄 Open & Print PDF</button>
                <button class="btn-cancel" onclick="closeModal('pdfModal')">Sluiten</button>
            </div>
        </div>
    </div>

    <!-- Instellingen Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>JSONBin Cloud Sync</h3>
            <label style="text-align:left; display:block; margin-top:10px;">API Key:</label>
            <input type="text" id="apiKeyInput" placeholder="API Key ($2a$10$...)">
            <label style="text-align:left; display:block; margin-top:10px;">Bin ID:</label>
            <input type="text" id="binIdInput" placeholder="Bin ID">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('settingsModal')">Sluiten</button>
                <button class="btn-confirm" onclick="saveSettings()">Opslaan & Sync</button>
            </div>
        </div>
    </div>

    <script>
        let medicines = JSON.parse(localStorage.getItem('med_list')) || [
            { id: 1, name: 'Paracetamol 500 g', dose: '3 x 2', sectors: ['Morgen', 'Middag', 'Avond'], time: '', note: '' },
            { id: 2, name: 'Entresto 24 mg/26 mg', dose: '2 x 1', sectors: ['Morgen', 'Avond'], time: '', note: '' },
            { id: 3, name: 'Pramipexol Aurobin', dose: '1x2', sectors: ['Avond'], time: '19:00', note: '' },
            { id: 4, name: 'Acenocoumarop CF', dose: 'Volgens schema', sectors: [], time: '', note: 'Avond eten' },
            { id: 5, name: 'Foster Nexthaler', dose: '200/6', sectors: ['Morgen', 'Avond'], time: '', note: '' },
            { id: 6, name: 'Alfacalcidol Aurobin', dose: '2 x 1', sectors: ['Morgen'], time: '', note: '' },
            { id: 7, name: 'Pantoprazol ARX 40 mg', dose: '1', sectors: ['Morgen'], time: '', note: '' },
            { id: 8, name: 'Fluuoxetine 30 mg', dose: '1', sectors: ['Morgen'], time: '', note: '' },
            { id: 9, name: 'Bisoprololfumaraat', dose: '1', sectors: ['Morgen'], time: '', note: '' },
            { id: 10, name: 'Amiodarol HCL Aurobindo 200 mg', dose: '1', sectors: ['Morgen'], time: '', note: '' }
        ];

        let logs = JSON.parse(localStorage.getItem('med_logs')) || {}; 
        let apiKey = localStorage.getItem('med_jsonbin_apikey') || '';
        let binId = localStorage.getItem('med_jsonbin_binid') || '';

        window.onload = async () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('selectedDate').value = today;
            document.getElementById('pdfStartDate').value = today;
            document.getElementById('pdfEndDate').value = today;

            if (apiKey && binId) {
                await syncWithCloud(false);
            } else {
                renderDailyList();
            }
        };

        function switchTab(tab) {
            document.getElementById('tabDaily').style.display = tab === 'daily' ? 'block' : 'none';
            document.getElementById('tabManage').style.display = tab === 'manage' ? 'block' : 'none';
            document.getElementById('tabDailyBtn').className = tab === 'daily' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabManageBtn').className = tab === 'manage' ? 'tab-btn active' : 'tab-btn';

            if (tab === 'manage') renderManagedList();
            if (tab === 'daily') renderDailyList();
        }

        function renderDailyList() {
            const selectedDate = document.getElementById('selectedDate').value;
            const dayLog = logs[selectedDate] || {};

            ['Morgen', 'Middag', 'Avond', 'Nacht'].forEach(sector => {
                const container = document.getElementById('sector' + sector);
                container.innerHTML = '';

                const sectorMeds = medicines.filter(m => {
                    if (m.sectors && m.sectors.includes(sector)) return true;
                    if (sector === 'Avond' && m.note && m.note.toLowerCase().includes('avond')) return true;
                    return false;
                });

                if (sectorMeds.length === 0) {
                    container.innerHTML = '<div style="font-size:11px; color:var(--text-muted); padding:4px;">Geen medicijnen.</div>';
                    return;
                }

                sectorMeds.forEach(m => {
                    const isTaken = dayLog[m.id] ? true : false;
                    const takenTime = isTaken ? dayLog[m.id] : '';

                    let extraInfo = [];
                    if (m.time) extraInfo.push(`Tijd: ${m.time}`);
                    if (m.note) extraInfo.push(`Opmerking: ${m.note}`);

                    container.innerHTML += `
                        <div class="med-item ${isTaken ? 'taken' : ''}">
                            <div class="med-info">
                                <span class="med-name">${m.name}</span>
                                <span class="med-dose">Dosering: ${m.dose} ${isTaken ? '• Ingenomen om ' + takenTime : ''}</span>
                                ${extraInfo.length > 0 ? `<span class="med-extra">${extraInfo.join(' | ')}</span>` : ''}
                            </div>
                            <button class="check-btn" onclick="toggleMedStatus(${m.id})">
                                ${isTaken ? '✓' : ''}
                            </button>
                        </div>
                    `;
                });
            });
        }

        function toggleMedStatus(medId) {
            const selectedDate = document.getElementById('selectedDate').value;
            if (!logs[selectedDate]) logs[selectedDate] = {};

            if (logs[selectedDate][medId]) {
                delete logs[selectedDate][medId];
            } else {
                const now = new Date();
                const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                logs[selectedDate][medId] = timeStr;
            }
            localStorage.setItem('med_logs', JSON.stringify(logs));
            renderDailyList();
        }

        async function saveAndSyncToday() {
            localStorage.setItem('med_logs', JSON.stringify(logs));
            await pushToCloud();
            alert('Afvinkstatus succesvol opgeslagen en gesynchroniseerd!');
        }

        function renderManagedList() {
            const container = document.getElementById('managedMedsList');
            container.innerHTML = '';

            if (medicines.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); font-size:12px;">Geen medicijnen ingesteld.</p>';
                return;
            }

            medicines.forEach((m, idx) => {
                let sectorsStr = m.sectors && m.sectors.length > 0 ? m.sectors.join(', ') : 'Geen vaste sector';
                if (m.note) sectorsStr += ` (${m.note})`;

                container.innerHTML += `
                    <div class="med-item">
                        <div class="med-info">
                            <span class="med-name">${m.name}</span>
                            <span class="med-dose">${sectorsStr} • Dosering: ${m.dose} ${m.time ? '• Tijd: '+m.time : ''}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteMedicine(${idx})">Verwijder</button>
                    </div>
                `;
            });
        }

        async function addMedicine() {
            const name = document.getElementById('newMedName').value.trim();
            const dose = document.getElementById('newMedDose').value.trim();
            const time = document.getElementById('newMedTime').value.trim();
            const note = document.getElementById('newMedNote').value.trim();
            
            const selectedSectors = [];
            document.querySelectorAll('.new-sector:checked').forEach(cb => {
                selectedSectors.push(cb.value);
            });

            if (!name) {
                alert('Vul a.u.b. een medicijnnaam in.');
                return;
            }

            const newMed = { 
                id: Date.now(), 
                name, 
                dose: dose || '1', 
                sectors: selectedSectors, 
                time, 
                note 
            };

            medicines.push(newMed);
            localStorage.setItem('med_list', JSON.stringify(medicines));

            document.getElementById('newMedName').value = '';
            document.getElementById('newMedDose').value = '';
            document.getElementById('newMedTime').value = '';
            document.getElementById('newMedNote').value = '';
            document.querySelectorAll('.new-sector').forEach(cb => cb.checked = false);

            renderManagedList();
            await pushToCloud();
            alert('Medicijn succesvol toegevoegd!');
        }

        async function deleteMedicine(idx) {
            if (confirm('Weet je zeker dat je dit medicijn wilt verwijderen?')) {
                medicines.splice(idx, 1);
                localStorage.setItem('med_list', JSON.stringify(medicines));
                renderManagedList();
                await pushToCloud();
            }
        }

        function getSectorIcon(sector) {
            switch (sector) {
                case 'Morgen': return '🌅';
                case 'Middag': return '☀️';
                case 'Avond': return '🌆';
                case 'Nacht': return '🌙';
                default: return '⏰';
            }
        }

        function generatePDFReport() {
            const start = document.getElementById('pdfStartDate').value;
            const end = document.getElementById('pdfEndDate').value;

            if (!start || !end) {
                alert('Selecteer een start- en einddatum.');
                return;
            }

            let reportHTML = `
                <html>
                <head>
                    <title>Medicijnen Inname Rapport (${start} t/m ${end})</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 25px; color: #1e293b; line-height: 1.4; background: #ffffff; }
                        h2 { color: #0f172a; border-bottom: 2px solid #00f2fe; padding-bottom: 8px; margin-bottom: 4px; font-size: 20px; }
                        .period { font-size: 12px; color: #64748b; margin-bottom: 25px; }
                        .day-block { margin-bottom: 30px; page-break-inside: avoid; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; background: #f8fafc; }
                        .day-title { font-size: 15px; font-weight: bold; color: #0284c7; margin-bottom: 12px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; }
                        
                        .sector-title { font-size: 12px; font-weight: bold; color: #334155; text-transform: uppercase; margin-top: 10px; margin-bottom: 6px; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; }
                        
                        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 11px; background: #ffffff; }
                        th, td { border: 1px solid #cbd5e1; padding: 6px 10px; text-align: left; vertical-align: middle; }
                        th { background: #f1f5f9; color: #475569; font-weight: bold; font-size: 10px; text-transform: uppercase; }
                        
                        .status-taken { color: #166534; font-weight: bold; background: #dcfce7; padding: 2px 6px; border-radius: 4px; display: inline-block; }
                        .status-not-taken { color: #991b1b; font-weight: bold; background: #fee2e2; padding: 2px 6px; border-radius: 4px; display: inline-block; }
                        .note-text { font-size: 10px; color: #d97706; font-weight: 600; margin-top: 2px; }
                    </style>
                </head>
                <body>
                    <h2>💊 Medicijnen & Inname Overzicht</h2>
                    <div class="period"><b>Periode:</b> ${start} t/m ${end}</div>
            `;

            let currDate = new Date(start + 'T00:00:00');
            let endDateObj = new Date(end + 'T00:00:00');

            const sectors = ['Morgen', 'Middag', 'Avond', 'Nacht'];

            while (currDate <= endDateObj) {
                let y = currDate.getFullYear();
                let m = String(currDate.getMonth() + 1).padStart(2, '0');
                let d = String(currDate.getDate()).padStart(2, '0');
                let dateStr = `${y}-${m}-${d}`;
                let formattedDate = `${d}-${m}-${y}`;

                let dayLog = logs[dateStr] || {};

                reportHTML += `
                    <div class="day-block">
                        <div class="day-title">📅 Datum: ${formattedDate}</div>
                `;

                sectors.forEach(sector => {
                    const sectorMeds = medicines.filter(med => {
                        if (med.sectors && med.sectors.includes(sector)) return true;
                        if (sector === 'Avond' && med.note && med.note.toLowerCase().includes('avond')) return true;
                        return false;
                    });

                    if (sectorMeds.length > 0) {
                        reportHTML += `
                            <div class="sector-title">${getSectorIcon(sector)} ${sector}</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 35%;">Medicijn</th>
                                        <th style="width: 20%;">Dosering</th>
                                        <th style="width: 25%;">Opmerking / Tijd</th>
                                        <th style="width: 20%;">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;

                        sectorMeds.forEach(med => {
                            let isTaken = dayLog[med.id] ? true : false;
                            let takenTime = isTaken ? dayLog[med.id] : '';
                            
                            let statusHtml = isTaken 
                                ? `<span class="status-taken">✓ Ja (${takenTime})</span>` 
                                : `<span class="status-not-taken">✕ Nee</span>`;

                            let extraInfo = [];
                            if (med.time) extraInfo.push(`Tijd: ${med.time}`);
                            if (med.note) extraInfo.push(`${med.note}`);

                            reportHTML += `
                                <tr>
                                    <td><b>${med.name}</b></td>
                                    <td>${med.dose || '1'}</td>
                                    <td>${extraInfo.length > 0 ? `<span class="note-text">${extraInfo.join(' | ')}</span>` : '-'}</td>
                                    <td>${statusHtml}</td>
                                </tr>
                            `;
                        });

                        reportHTML += `
                                </tbody>
                            </table>
                        `;
                    }
                });

                reportHTML += `</div>`;
                currDate.setDate(currDate.getDate() + 1);
            }

            reportHTML += `
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `;

            const win = window.open('', '_blank');
            win.document.write(reportHTML);
            win.document.close();
            closeModal('pdfModal');
        }

        function openModal(id) {
            if (id === 'settingsModal') {
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('binIdInput').value = binId;
            }
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function syncWithCloud(showAlert = false) {
            if (!apiKey) return;
            document.getElementById('syncStatus').innerText = 'Cloud: Synchroniseren...';

            try {
                if (!binId) {
                    const createRes = await fetch('https://api.jsonbin.io/v3/b', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': apiKey,
                            'X-Bin-Private': 'true'
                        },
                        body: JSON.stringify({ medicines, logs })
                    });
                    const createData = await createRes.json();
                    if (createData.metadata && createData.metadata.id) {
                        binId = createData.metadata.id;
                        localStorage.setItem('med_jsonbin_binid', binId);
                    }
                }

                const getRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Master-Key': apiKey }
                });
                const getData = await getRes.json();

                if (getData.record) {
                    if (getData.record.medicines) {
                        medicines = getData.record.medicines;
                        localStorage.setItem('med_list', JSON.stringify(medicines));
                    }
                    if (getData.record.logs) {
                        logs = getData.record.logs;
                        localStorage.setItem('med_logs', JSON.stringify(logs));
                    }
                    document.getElementById('syncStatus').innerText = 'Cloud: Verbonden';
                    if (showAlert) alert('Verbonden & gesynchroniseerd!');
                }
                renderDailyList();
            } catch (error) {
                console.error(error);
                document.getElementById('syncStatus').innerText = 'Cloud: Fout bij sync';
            }
        }

        async function pushToCloud() {
            if (!apiKey || !binId) return;
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify({ medicines, logs })
                });
                document.getElementById('syncStatus').innerText = 'Cloud: Opgeslagen';
            } catch (error) {
                console.error(error);
                document.getElementById('syncStatus').innerText = 'Cloud: Opslaan mislukt';
            }
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            binId = document.getElementById('binIdInput').value.trim();
            localStorage.setItem('med_jsonbin_apikey', apiKey);
            localStorage.setItem('med_jsonbin_binid', binId);
            closeModal('settingsModal');
            syncWithCloud(true);
        }
    </script>
</body>
</html>
